services:
  portal:
    build: .
    image: dogfood-portal:latest
    container_name: dogfood-portal
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - PORTAL_ORIGIN=http://localhost:8080

volumes:
  postgres-data:
    driver: local
